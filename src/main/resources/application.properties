micronaut.application.name=dogs

micronaut.server.port=8080

# A caller who asks for more than max-page-size is given max-page-size rather than an error.
micronaut.data.pageable.default-page-size=20
micronaut.data.pageable.max-page-size=100

# non_null keeps empty collections in the response - Micronaut would otherwise drop "content".
micronaut.serde.serialization.inclusion=non_null

# H2 in memory, created by the Flyway migrations on start-up. DB_CLOSE_DELAY=-1 keeps it alive
# for the life of the application rather than the first connection.
datasources.default.url=jdbc:h2:mem:dogs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
datasources.default.driver-class-name=org.h2.Driver
datasources.default.username=sa
datasources.default.password=
datasources.default.dialect=H2
# The schema is owned by the migrations, so Micronaut Data must not generate one.
datasources.default.schema-generate=NONE

flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration

# Publishes the compile-time OpenAPI document and the views that read it. Which views are
# generated is set in openapi.properties, which build.gradle.kts declares as a compile input.
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.redoc.paths=classpath:META-INF/swagger/views/redoc
micronaut.router.static-resources.redoc.mapping=/redoc/**
micronaut.router.static-resources.rapidoc.paths=classpath:META-INF/swagger/views/rapidoc
micronaut.router.static-resources.rapidoc.mapping=/rapidoc/**
micronaut.router.static-resources.openapi-explorer.paths=classpath:META-INF/swagger/views/openapi-explorer
micronaut.router.static-resources.openapi-explorer.mapping=/openapi-explorer/**
